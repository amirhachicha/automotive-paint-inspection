services:
  - type: web
    name: automotive-paint-inspection
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PAINT_ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9
